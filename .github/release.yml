changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 🚀 Novedades
      labels:
        - enhancement
        - feature
    - title: 🐛 Correcciones
      labels:
        - bug
        - fix
    - title: 🔐 Seguridad
      labels:
        - security
    - title: 📚 Documentación
      labels:
        - documentation
        - docs
    - title: 🧰 Mantenimiento
      labels:
        - "*"
